<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NPTOK</title>
  <style>
    body {
      margin: 0;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
    }

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 15px;
      text-align: center;
      font-size: 25px;
      font-weight: bold;
    }

    .video {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
    }

    .buttons {
      display: flex;
      justify-content: space-around;
      padding: 15px;
      font-size: 18px;
    }

    button {
      background: none;
      color: white;
      border: none;
      font-size: 18px;
    }
  </style>
</head>

<body>
  <div class="app">

    <header>NPTOK</header>

    <div class="video">
      🎬 NPTOK
    </div>

    <div class="buttons">
      <button>❤️ Like</button>
      <button>💬 Comment</button>
      <button>↗️ Share</button>
      <button>👤 Profile</button>
    </div>

  </div>
</body>
</html>
