<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NPTOK</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#000;
  color:#fff;
  overflow-x:hidden;
}

header{
  height:60px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
  background:#000;
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  font-size:25px;
  font-weight:bold;
}

.searchBtn{
  background:#222;
  border:0;
  color:#fff;
  border-radius:20px;
  padding:9px 15px;
}

.feed{
  padding-bottom:75px;
}

.videoCard{
  width:100%;
  height:calc(100vh - 60px);
  min-height:550px;
  position:relative;
  background:#111;
  overflow:hidden;
}

.videoCard video{
  width:100%;
  height:100%;
  object-fit:cover;
}

.noVideo{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#aaa;
  font-size:18px;
}

.info{
  position:absolute;
  bottom:25px;
  left:15px;
  right:80px;
  text-shadow:0 1px 5px #000;
}

.username{
  font-weight:bold;
  font-size:18px;
  margin-bottom:8px;
}

.caption{
  font-size:15px;
}

.actions{
  position:absolute;
  right:12px;
  bottom:80px;
  display:flex;
  flex-direction:column;
  gap:18px;
  align-items:center;
}

.action{
  text-align:center;
  cursor:pointer;
}

.actionIcon{
  font-size:30px;
}

.actionText{
  font-size:12px;
  margin-top:3px;
}

.bottomNav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:65px;
  background:#000;
  border-top:1px solid #333;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:200;
}

.navItem{
  color:#fff;
  text-align:center;
  font-size:12px;
  cursor:pointer;
}

.navIcon{
  font-size:24px;
  display:block;
}

.plus{
  background:#fff;
  color:#000;
  padding:5px 15px;
  border-radius:8px;
  font-size:25px;
}

.page{
  display:none;
  min-height:calc(100vh - 60px);
  padding:20px;
  padding-bottom:90px;
}

.page.active{
  display:block;
}

.profileBox{
  text-align:center;
  padding:25px 10px;
}

.avatar{
  width:90px;
  height:90px;
  border-radius:50%;
  background:#333;
  display:flex;
  justify-content:center;
  align-items:center;
  margin:auto;
  font-size:40px;
}

.profileName{
  font-size:22px;
  margin:12px 0 5px;
}

.stats{
  display:flex;
  justify-content:center;
  gap:35px;
  margin:20px 0;
}

.stat{
  text-align:center;
}

.stat b{
  display:block;
  font-size:20px;
}

button{
  border:0;
  padding:12px 18px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.followBtn{
  background:#ff1744;
  color:white;
}

.uploadBox{
  border:2px dashed #555;
  border-radius:15px;
  padding:40px 20px;
  text-align:center;
  margin-top:25px;
}

.uploadBox input{
  margin-top:20px;
}

input,textarea{
  width:100%;
  padding:13px;
  margin:8px 0;
  border:1px solid #444;
  border-radius:8px;
  background:#151515;
  color:white;
}

.commentBox{
  margin-top:20px;
}

.comment{
  padding:10px 0;
  border-bottom:1px solid #333;
}

.searchInput{
  margin-bottom:20px;
}

.userResult{
  background:#151515;
  padding:15px;
  border-radius:10px;
  margin-bottom:10px;
}

.liveBox{
  text-align:center;
  padding:40px 10px;
}

.liveButton{
  background:red;
  color:white;
  font-size:18px;
  padding:15px 30px;
  border-radius:30px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  z-index:500;
  align-items:flex-end;
}

.modalContent{
  background:#151515;
  width:100%;
  max-height:75vh;
  overflow:auto;
  padding:20px;
  border-radius:20px 20px 0 0;
}

.close{
  float:right;
  font-size:25px;
  cursor:pointer;
}

#toast{
  display:none;
  position:fixed;
  bottom:80px;
  left:50%;
  transform:translateX(-50%);
  background:#fff;
  color:#000;
  padding:12px 18px;
  border-radius:20px;
  z-index:1000;
}
</style>
</head>

<body>

<header>
  <div class="logo">NPTOK</div>
  <button class="searchBtn" onclick="showPage('searchPage')">🔍 Search</button>
</header>

<!-- HOME -->
<div id="homePage" class="page active" style="padding:0">

  <div class="feed" id="feed">

    <div class="videoCard">

      <div class="noVideo">
        🎬 NPTOK<br>
        <small>Upload your first video</small>
      </div>

      <div class="info">
        <div class="username">@nptok</div>
        <div class="caption">
          Welcome to NPTOK 🇳🇵
        </div>
      </div>

      <div class="actions">

        <div class="action" onclick="likeVideo(this)">
          <div class="actionIcon">❤️</div>
          <div class="actionText">0</div>
        </div>

        <div class="action" onclick="openComments()">
          <div class="actionIcon">💬</div>
          <div class="actionText">0</div>
        </div>

        <div class="action" onclick="followUser(this)">
          <div class="actionIcon">➕</div>
          <div class="actionText">Follow</div>
        </div>

        <div class="action" onclick="shareVideo()">
          <div class="actionIcon">↗️</div>
          <div class="actionText">Share</div>
        </div>

      </div>

    </div>

  </div>
</div>


<!-- SEARCH -->
<div id="searchPage" class="page">

  <h2>🔍 Search</h2>

  <input
    class="searchInput"
    id="searchInput"
    placeholder="Search user or video..."
    oninput="searchUsers()"
  >

  <div id="searchResults"></div>

</div>


<!-- UPLOAD -->
<div id="uploadPage" class="page">

  <h2>⬆️ Upload Video</h2>

  <div class="uploadBox">

    <h3>Select your video</h3>

    <input
      type="file"
      id="videoInput"
      accept="video/*"
      onchange="previewVideo(event)"
    >

    <div id="preview"></div>

    <input
      id="captionInput"
      placeholder="Write a caption..."
    >

    <button
      onclick="uploadVideo()"
      style="background:#ff1744;color:white"
    >
      Upload
    </button>

  </div>

</div>


<!-- PROFILE -->
<div id="profilePage" class="page">

  <div class="profileBox">

    <div class="avatar">👤</div>

    <div class="profileName">@nptokuser</div>

    <div>My NPTOK Profile</div>

    <div class="stats">

      <div class="stat">
        <b id="followingCount">0</b>
        Following
      </div>

      <div class="stat">
        <b id="followerCount">0</b>
        Followers
      </div>

      <div class="stat">
        <b id="likeCount">0</b>
        Likes
      </div>

    </div>

    <button
      class="followBtn"
      onclick="editProfile()"
    >
      Edit Profile
    </button>

  </div>

  <hr>

  <h3 style="margin-top:20px">My Videos</h3>

  <div id="myVideos"></div>

</div>


<!-- LIVE -->
<div id="livePage" class="page">

  <div class="liveBox">

    <h1>🔴 NPTOK LIVE</h1>

    <p id="liveMessage" style="margin:20px 0">
      Checking followers...
    </p>

    <button
      id="liveButton"
      class="liveButton"
      onclick="startLive()"
    >
      🔴 START LIVE
    </button>

  </div>

</div>


<!-- COMMENTS MODAL -->
<div class="modal" id="commentModal">

  <div class="modalContent">

    <span class="close" onclick="closeComments()">×</span>

    <h2>Comments</h2>

    <div id="comments"></div>

    <div class="commentBox">

      <input
        id="commentInput"
        placeholder="Write a comment..."
      >

      <button
        onclick="addComment()"
        style="background:#ff1744;color:white"
      >
        Comment
      </button>

    </div>

  </div>

</div>


<!-- BOTTOM NAV -->
<div class="bottomNav">

  <div class="navItem" onclick="showPage('homePage')">
    <span class="navIcon">🏠</span>
    Home
  </div>

  <div class="navItem" onclick="showPage('searchPage')">
    <span class="navIcon">🔍</span>
    Search
  </div>

  <div class="navItem" onclick="showPage('uploadPage')">
    <span class="plus">＋</span>
  </div>

  <div class="navItem" onclick="showPage('livePage')">
    <span class="navIcon">🔴</span>
    Live
  </div>

  <div class="navItem" onclick="showPage('profilePage')">
    <span class="navIcon">👤</span>
    Profile
  </div>

</div>


<div id="toast"></div>


<script>

let followers =
  Number(localStorage.getItem("nptok_followers")) || 0;

let following =
  Number(localStorage.getItem("nptok_following")) || 0;

let likes =
  Number(localStorage.getItem("nptok_likes")) || 0;

let comments =
  JSON.parse(localStorage.getItem("nptok_comments") || "[]");

let myVideos =
  JSON.parse(localStorage.getItem("nptok_videos") || "[]");


function saveData(){

  localStorage.setItem(
    "nptok_followers",
    followers
  );

  localStorage.setItem(
    "nptok_following",
    following
  );

  localStorage.setItem(
    "nptok_likes",
    likes
  );

  localStorage.setItem(
    "nptok_comments",
    JSON.stringify(comments)
  );

  localStorage.setItem(
    "nptok_videos",
    JSON.stringify(myVideos)
  );

}


function showPage(id){

  document
    .querySelectorAll(".page")
    .forEach(p => p.classList.remove("active"));

  document
    .getElementById(id)
    .classList.add("active");

  if(id === "profilePage"){
    updateProfile();
  }

  if(id === "livePage"){
    checkLive();
  }

}


function toast(message){

  const t = document.getElementById("toast");

  t.innerText = message;
  t.style.display = "block";

  setTimeout(()=>{
    t.style.display = "none";
  },2000);

}


function likeVideo(element){

  const text =
    element.querySelector(".actionText");

  let count =
    Number(text.innerText);

  if(element.dataset.liked === "yes"){

    count--;
    likes--;

    element.dataset.liked = "no";

  }else{

    count++;
    likes++;

    element.dataset.liked = "yes";

  }

  text.innerText = count;

  saveData();

  updateProfile();

}


function followUser(element){

  const text =
    element.querySelector(".actionText");

  if(element.dataset.followed === "yes"){

    followers--;
    following--;

    text.innerText = "Follow";

    element.dataset.followed = "no";

    toast("Unfollowed");

  }else{

    followers++;
    following++;

    text.innerText = "Following";

    element.dataset.followed = "yes";

    toast("Following");

  }

  saveData();
  updateProfile();

}


function openComments(){

  document
    .getElementById("commentModal")
    .style.display = "flex";

  showComments();

}


function closeComments(){

  document
    .getElementById("commentModal")
    .style.display = "none";

}


function addComment(){

  const input =
    document.getElementById("commentInput");

  const text =
    input.value.trim();

  if(!text){

    toast("Write a comment first");

    return;

  }

  comments.push({

    user:"@nptokuser",

    text:text

  });

  input.value = "";

  saveData();

  showComments();

  toast("Comment added");

}


function showComments(){

  const box =
    document.getElementById("comments");

  box.innerHTML = "";

  if(comments.length === 0){

    box.innerHTML =
      "<p style='color:#aaa;margin-top:20px'>No comments yet.</p>";

    return;

  }

  comments.forEach(c=>{

    const div =
      document.createElement("div");

    div.className = "comment";

    div.innerHTML =
      "<b>"+escapeHTML(c.user)+"</b><br>"+
      escapeHTML(c.text);

    box.appendChild(div);

  });

}


function escapeHTML(text){

  const div =
    document.createElement("div");

  div.innerText = text;

  return div.innerHTML;

}


function shareVideo(){

  if(navigator.share){

    navigator.share({

      title:"NPTOK",

      text:"Check this video on NPTOK!"

    });

  }else{

    navigator.clipboard
      .writeText(location.href);

    toast("Link copied");

  }

}


function previewVideo(event){

  const file =
    event.target.files[0];

  if(!file) return;

  const url =
    URL.createObjectURL(file);

  document.getElementById("preview").innerHTML = `

    <video
      src="${url}"
      controls
      style="
        width:100%;
        max-height:400px;
        margin-top:20px;
        border-radius:10px;
      "
    ></video>

  `;

}


function uploadVideo(){

  const input =
    document.getElementById("videoInput");

  const caption =
    document.getElementById("captionInput").value;

  if(!input.files.length){

    toast("Select a video first");

    return;

  }

  const file =
    input.files[0];

  const url =
    URL.createObjectURL(file);

  myVideos.push({

    name:file.name,

    url:url,

    caption:caption || "My NPTOK video"

  });

  saveData();

  showMyVideos();

  toast("Video added");

  input.value = "";

  document.getElementById("captionInput").value = "";

}


function showMyVideos(){

  const box =
    document.getElementById("myVideos");

  box.innerHTML = "";

  myVideos.forEach(video=>{

    const div =
      document.createElement("div");

    div.style.marginTop = "20px";

    div.innerHTML = `

      <video
        src="${video.url}"
        controls
        style="
          width:100%;
          border-radius:10px;
        "
      ></video>

      <p style="margin-top:8px">
        ${escapeHTML(video.caption)}
      </p>

    `;

    box.appendChild(div);

  });

}


function updateProfile(){

  document.getElementById(
    "followerCount"
  ).innerText = followers;

  document.getElementById(
    "followingCount"
  ).innerText = following;

  document.getElementById(
    "likeCount"
  ).innerText = likes;

  showMyVideos();

}


function editProfile(){

  const name =
    prompt(
      "Enter your NPTOK username:",
      "nptokuser"
    );

  if(name){

    document.querySelector(
      ".profileName"
    ).innerText = "@"+name;

    localStorage.setItem(
      "nptok_username",
      name
    );

  }

}


function searchUsers(){

  const query =
    document.getElementById(
      "searchInput"
    ).value.toLowerCase();

  const box =
    document.getElementById(
      "searchResults"
    );

  box.innerHTML = "";

  if(!query) return;

  const users = [

    "@nptok",
    "@nptokuser",
    "@nepal",
    "@nepalvideo",
    "@creator"

  ];

  users
    .filter(u =>
      u.toLowerCase().includes(query)
    )
    .forEach(user=>{

      const div =
        document.createElement("div");

      div.className =
        "userResult";

      div.innerHTML = `

        <b>${user}</b>

        <button
          style="
            float:right;
            background:#ff1744;
            color:white;
          "
          onclick="toast('Followed ${user}')"
        >
          Follow
        </button>

      `;

      box.appendChild(div);

    });

}


function checkLive(){

  const message =
    document.getElementById("liveMessage");

  const button =
    document.getElementById("liveButton");

  if(followers >= 800){

    message.innerText =
      "You have reached 800 followers. Live is unlocked.";

    button.disabled = false;

  }else{

    message.innerText =
      "Live unlocks when you reach 800 followers. Current followers: "
      + followers;

    button.disabled = true;

  }

}


function startLive(){

  if(followers < 800){

    toast("800 followers required");

    return;

  }

  toast(
    "Live screen ready — real streaming backend needed"
  );

}


const savedName =
  localStorage.getItem("nptok_username");

if(savedName){

  document.querySelector(
    ".profileName"
  ).innerText =
    "@"+savedName;

}

updateProfile();

checkLive();


// PWA Service Worker
if("serviceWorker" in navigator){

  window.addEventListener("load",()=>{

    navigator.serviceWorker
      .register("./sw.js")
      .then(()=>{
        console.log("NPTOK service worker registered");
      })
      .catch(err=>{
        console.log(
          "Service worker error:",
          err
        );
      });

  });

}

</script>

</body>
  </html>
